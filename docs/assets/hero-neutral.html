<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siderkit Break — neutral hero</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        inline-size: 1280px;
        block-size: 640px;
        overflow: hidden;
      }

      body {
        position: relative;
        background:
          radial-gradient(1100px 640px at 78% 16%, rgba(47, 125, 91, 0.16), transparent 62%),
          radial-gradient(760px 520px at 12% 88%, rgba(214, 168, 96, 0.16), transparent 64%),
          linear-gradient(135deg, #fbf8f0 0%, #f3f7ef 52%, #e7f0e6 100%);
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.2;
        background-image: radial-gradient(rgba(23, 57, 44, 0.18) 0.6px, transparent 0.6px);
        background-size: 5px 5px;
        mask-image: linear-gradient(180deg, #000 0%, transparent 82%);
      }

      .glow {
        position: absolute;
        inset-block-start: 40px;
        inset-inline-start: 300px;
        inline-size: 640px;
        block-size: 560px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(47, 125, 91, 0.24) 0%, transparent 68%);
        filter: blur(34px);
      }

      .window {
        position: absolute;
        inset-block-start: 20px;
        inset-inline-start: 280px;
        inline-size: 360px;
        border-radius: 18px;
        box-shadow:
          0 40px 80px -34px rgba(17, 54, 41, 0.52),
          0 14px 30px -16px rgba(17, 54, 41, 0.32);
      }

      .card {
        position: absolute;
        inset-block-start: 356px;
        inset-inline-start: 650px;
        inline-size: 360px;
        transform: rotate(-2.6deg);
        filter: drop-shadow(0 34px 36px rgba(17, 54, 41, 0.26));
      }

      .overlay {
        position: absolute;
        inset-block-start: 124px;
        inset-inline-start: 680px;
        inline-size: 168px;
        filter: drop-shadow(0 18px 22px rgba(17, 54, 41, 0.2));
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <div class="glow"></div>
    <img class="window" src="./main-focus.png" alt="" />
    <img class="card" src="./break-running.png" alt="" />
    <img class="overlay" src="./overlay-focus.png" alt="" />
  </body>
</html>
