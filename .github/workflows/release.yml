name: Release

# Builds every installer for a tag and attaches them to a draft GitHub release.
# GitHub Releases is the only binary store: the dl.siderkit.com Worker proxies
# `releases/download/...` under `/<product>/`, and `/<product>/latest.json`
# reads the latest published release's `latest-dl.json`. Publishing the release
# is therefore the switch that ships the update; no extra promotion job is
# needed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build signed NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            patchelf \
            rpm \
            build-essential
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    name: Draft release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Strip the leading v from the version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Check the package version matches the tag
        run: |
          node -e "const p=require('./package.json'); if (p.version !== process.env.VERSION) { console.error('package.json is ' + p.version + ', tag is ' + process.env.VERSION); process.exit(1); }"
      - name: Normalize artifact names
        run: |
          set -euo pipefail
          mkdir -p out
          exe="$(find dist -name '*-setup.exe' -type f | head -n 1)"
          sig="$(find dist -name '*-setup.exe.sig' -type f | head -n 1)"
          dmg="$(find dist -name '*.dmg' -type f | head -n 1)"
          deb="$(find dist -name '*.deb' -type f | head -n 1)"
          rpm="$(find dist -name '*.rpm' -type f | head -n 1)"
          appimage="$(find dist -name '*.AppImage' -type f | head -n 1)"
          test -n "$exe" && test -n "$sig" && test -n "$dmg"
          test -n "$deb" && test -n "$rpm" && test -n "$appimage"
          # Asset names stay version-free: the tag already carries the version,
          # so `dl.siderkit.com/<product>/releases/<version>/<file>` maps onto
          # them.
          cp "$exe" "out/Siderkit-Break_windows_x64-setup.exe"
          cp "$sig" "out/Siderkit-Break_windows_x64-setup.exe.sig"
          cp "$dmg" "out/Siderkit-Break_macos_universal.dmg"
          cp "$deb" "out/Siderkit-Break_linux_amd64.deb"
          cp "$rpm" "out/Siderkit-Break_linux_x86_64.rpm"
          cp "$appimage" "out/Siderkit-Break_linux_amd64.AppImage"
          (cd out && sha256sum Siderkit-Break_* > SHA256SUMS.txt)
      - name: Build the branded manifest
        run: |
          node scripts/make-latest-json.mjs \
            --version "$VERSION" \
            --installer "out/Siderkit-Break_windows_x64-setup.exe" \
            --signature "out/Siderkit-Break_windows_x64-setup.exe.sig" \
            --url "https://dl.siderkit.com/siderkit-break/releases/$VERSION/Siderkit-Break_windows_x64-setup.exe" \
            --out out/latest-dl.json
      - name: Build the GitHub fallback manifest
        run: |
          node scripts/make-latest-json.mjs \
            --version "$VERSION" \
            --installer "out/Siderkit-Break_windows_x64-setup.exe" \
            --signature "out/Siderkit-Break_windows_x64-setup.exe.sig" \
            --url "https://github.com/${{ github.repository }}/releases/download/$TAG/Siderkit-Break_windows_x64-setup.exe" \
            --out out/latest.json
      - name: Create or update the draft release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo "release $TAG is already published; refusing to replace its assets" >&2
              exit 1
            fi
            gh release upload "$TAG" out/latest.json out/latest-dl.json out/SHA256SUMS.txt out/Siderkit-Break_* --clobber
          else
            gh release create "$TAG" out/latest.json out/latest-dl.json out/SHA256SUMS.txt out/Siderkit-Break_* \
              --draft \
              --title "Siderkit Break $VERSION" \
              --generate-notes
          fi
