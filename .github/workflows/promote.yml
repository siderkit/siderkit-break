name: Verify update manifest

# Publishing a GitHub release is the human approval step for auto-updates: the
# dl.siderkit.com Worker serves `releases/latest/download/latest-dl.json` as
# `/siderkit-break/latest.json`, so the published release becomes live
# immediately. This job only checks that the switch actually took effect.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Check dl.siderkit.com
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Wait for the release to become latest
        run: sleep 30
      - name: Check the live manifest matches the tag
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            https://dl.siderkit.com/siderkit-break/latest.json -o latest.json
          actual="$(node -p "require('./latest.json').version")"
          if [ "$actual" != "$expected" ]; then
            echo "live manifest is $actual, tag is $expected" >&2
            exit 1
          fi
          url="$(node -p "Object.values(require('./latest.json').platforms)[0].url")"
          echo "manifest $actual -> $url"
          curl -fsSIL --retry 5 --retry-delay 10 --retry-all-errors "$url" | head -n 1
