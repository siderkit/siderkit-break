name: Build installers

# Builds the platform installers and keeps them as workflow artifacts.
# It never creates a release; publishing stays a manual decision.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows
            target: ''
          - os: macos-latest
            bundles: dmg
            artifact: macos-universal
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux
            target: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            rpm \
            build-essential
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          else
            pnpm tauri build --bundles "${{ matrix.bundles }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: siderkit-break-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/universal-apple-darwin/release/bundle/**/*
