name: Promote update manifest

# Publishing a GitHub release is the human approval step for auto-updates.
# This workflow copies the R2-flavoured manifest built by release.yml to
# https://dl.siderkit.com/latest.json.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  promote:
    name: Copy latest-r2.json to R2
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the R2 manifest from the release
        run: gh release download "$TAG" --pattern latest-r2.json --dir .
      - name: Check the manifest version matches the tag
        run: |
          node -e "const m=require('./latest-r2.json'); const tag=process.env.TAG.replace(/^v/, ''); if (m.version !== tag) { console.error('manifest is ' + m.version + ', tag is ' + tag); process.exit(1); }"
      - name: Replace the live manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$R2_BUCKET"
          aws s3 cp latest-r2.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-store"
